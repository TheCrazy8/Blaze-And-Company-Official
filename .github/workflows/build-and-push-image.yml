name: Build and publish server Docker image

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/blaze-server:latest
            ghcr.io/${{ github.repository_owner }}/blaze-server:${{ github.sha }}

      - name: Smoke test image (optional)
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/blaze-server:latest python -c "print('smoke test ok')"