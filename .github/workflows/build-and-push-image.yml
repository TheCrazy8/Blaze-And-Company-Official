# Build + push Docker image to GHCR (ensures repository owner is lowercased)
# Save this file as .github/workflows/docker-publish.yml
name: Build and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (optional, for multi-arch)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          push: true
          platforms: linux/amd64
          # Lowercase the repository owner so the resulting tag is valid
          tags: |
            ghcr.io/${{ toLower(github.repository_owner) }}/blaze-server:latest
            ghcr.io/${{ toLower(github.repository_owner) }}/blaze-server:${{ github.sha }}
